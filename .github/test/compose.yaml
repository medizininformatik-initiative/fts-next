name: fts-test

networks:
  agents:
  clinical-domain:
  research-domain:
  trust-center:
  gics:
  gpas:

include:
- cd-agent/compose.yaml
- rd-agent/compose.yaml
- tc-agent/compose.yaml
- oauth2/compose.yaml

services:
  # Clinical Domain
  cd-hds:
    image: samply/blaze:1.11.0@sha256:7b85c55df66122061abade67c715959b38508bb74bc28f62f262771e00f9a66c
    ports: [ ":8080" ]
    networks: [ "clinical-domain" ]
    environment:
      BASE_URL: "http://cd-hds:8080"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Research Domain
  rd-hds:
    image: samply/blaze:1.11.0@sha256:7b85c55df66122061abade67c715959b38508bb74bc28f62f262771e00f9a66c
    ports: [ ":8080" ]
    networks: [ "research-domain" ]
    environment:
      BASE_URL: "http://rd-hds:8080"
      ENFORCE_REFERENTIAL_INTEGRITY: "false"
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Trust Center
  gics:
    image: mosaicgreifswald/gics:2026.1.1@sha256:9ebb43bbb4a9984fa8e5e75d2342b47951bc4ca580b8be1f445073fbb7c6fd21
    ports: [ ":8080" ]
    networks: [ "gics", "trust-center" ]
    restart: on-failure:3
    environment:
      TTP_GICS_DB_HOST: "gics-db"
      WF_NO_ADMIN: "true"
      MOS_INCLUDE_PROCESSES: "wildfly"
    depends_on:
      gics-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/ttp-fhir/fhir/gics/metadata" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
  gics-db:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    volumes:
    - ./gics/initdb/:/docker-entrypoint-initdb.d
    command: --max_allowed_packet=20M --default-time-zone=Europe/Berlin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gics
      MYSQL_USER: gics_user
      MYSQL_PASSWORD: gics_password
    networks: [ "gics" ]
    healthcheck:
      test: [ "CMD", "/usr/bin/mysql", "-h", "localhost", "-ugics_user", "-pgics_password", "gics", "-e", "SELECT ready FROM _ready LIMIT 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
  gpas:
    image: mosaicgreifswald/gpas:2025.2.0@sha256:e61946ae994e658ecdeb5dfc86b4102d248e22cfdde10b6c6e6dfefeb654739c
    ports: [ ":8080" ]
    networks: [ "gpas", "trust-center" ]
    restart: on-failure:3
    environment:
      TTP_GPAS_DB_HOST: "gpas-db"
      WF_NO_ADMIN: "true"
      MOS_INCLUDE_PROCESSES: "wildfly"
    depends_on:
      gpas-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sSf", "http://localhost:8080/ttp-fhir/fhir/gpas/metadata" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s
  gpas-db:
    image: mysql:9.7.2@sha256:29abb0a179982e4a8928138bfc7f918af9eda64e7eeb1b1d084c1720a20159e6
    volumes:
    - ./gpas/initdb/:/docker-entrypoint-initdb.d
    command: --max_allowed_packet=20M --default-time-zone=Europe/Berlin
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gpas
      MYSQL_USER: gpas_user
      MYSQL_PASSWORD: gpas_password
    networks: [ "gpas" ]
    healthcheck:
      test: [ "CMD", "/usr/bin/mysql", "-h", "localhost", "-ugpas_user", "-pgpas_password", "gpas", "-e", "SELECT ready FROM _ready LIMIT 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
