name: Pages

on:
  push:
    tags: [ "v*.*.*" ]
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]
  merge_group:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (v*.*.*) to link docs downloads against; empty = newest published release"
        required: false
        type: string

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -B -U -T1C -Dfts.retryTimeout=false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used in `settings.xml` generated by actions/setup-java
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set up JDK 21
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'

    - name: Build Images
      run: make all

    - name: Determine Release Tag
      id: gh_latest_tag
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        # Passed via env instead of template interpolation to keep the input out of script code
        RELEASE_TAG: ${{ inputs.release_tag }}
      with:
        script: |
          const semver = /^v\d+\.\d+\.\d+$/;

          const explicit = (process.env.RELEASE_TAG ?? "").trim();
          if (explicit) {
            if (!semver.test(explicit)) {
              core.setFailed(`release_tag input "${explicit}" is not a v*.*.* tag.`);
              return;
            }
            console.log(`Building docs against dispatched release: ${explicit}`);
            core.setOutput("latest_tag", explicit);
            return;
          }

          const releases = await github.rest.repos.listReleases({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100,
          });

          const published = releases.data.filter((release) =>
            !release.draft
            && !release.prerelease
            && semver.test(release.tag_name ?? ""));
          if (published.length === 0) {
            core.setFailed("No published v*.*.* release found to link docs downloads against.");
            return;
          }

          // listReleases orders by creation date, which ranks a hotfix for an
          // older line above the actual newest version — compare semver instead
          const version = (release) => release.tag_name.slice(1).split(".").map(Number);
          const latest = published.reduce((a, b) => {
            const [va, vb] = [version(a), version(b)];
            return (va[0] - vb[0] || va[1] - vb[1] || va[2] - vb[2]) >= 0 ? a : b;
          });
          console.log(`Building docs against release: ${latest.tag_name}`);
          core.setOutput("latest_tag", latest.tag_name);

    - name: Clear Application Yamls
      working-directory: .github/test
      run: |
        echo "" | tee cd-agent/application.yaml rd-agent/application.yaml tc-agent/application.yaml
        sed -i 's#https://localhost#http://localhost#g' tc-agent/compose.yaml

    - name: Build OpenAPI Specs
      working-directory: docs
      run: make generate-openapi

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 21
        cache: npm
        cache-dependency-path: 'docs/package-lock.json'

    - name: Build Documentation
      working-directory: docs
      env:
        DOCS_BASE: "/${{ github.event.repository.name }}/"
        VITE_LATEST_RELEASE: ${{ steps.gh_latest_tag.outputs.latest_tag }}
      run: make build

    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload artifact
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/.vitepress/dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    needs: [ build ]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
