name: Mutation

on:
  pull_request:
    branches: [ "**" ]
  schedule:
  # Every Sunday at 03:30 UTC
  - cron: '30 3 * * 0'
  workflow_dispatch:

# Declare default permissions as read-only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  modules:
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: List Modules to Mutate
      id: modules
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          modules=$(.github/scripts/mutation-modules.sh "origin/${GITHUB_BASE_REF}")
        else
          modules=$(printf '%s\n' api util clinical-domain-agent trust-center-agent research-domain-agent)
        fi
        echo "modules=$(jq -Rnc '[inputs | select(test("^[a-z][a-z-]*$"))]' <<< "${modules}")" >> "${GITHUB_OUTPUT}"

  mutation:
    needs: modules
    if: needs.modules.outputs.modules != '[]'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used in `settings.xml` generated by actions/setup-java
      MODULE: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: 25.0.4+101.0.LTS
        cache: 'maven'
        cache-dependency-path: |
          pom.xml
          {api,util,test-util}/pom.xml
          ${{ matrix.module }}/pom.xml

    - name: Install Upstream Modules
      run: |
        mvn -B -U -T1C -DskipTests -DskipITs -Dcheckstyle.skip -Dcyclonedx.skip \
          -Dspring-boot.repackage.skip=true \
          --also-make --projects "${MODULE}" install

    - name: Install xq
      env:
        # renovate: datasource=pypi depName=yq
        YQ_VERSION: 4.1.2
      run: pipx install "yq==${YQ_VERSION}"

    - name: Run Mutation Tests
      run: MAVEN_ARGS="-pl ${MODULE}" .github/scripts/mutation.sh -Dpit.threads=4

    - name: List Surviving Mutants
      if: always()
      run: .github/scripts/mutation-survived.sh "${MODULE}"

    - name: Upload PIT Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pit-reports-${{ matrix.module }}
        path: ${{ matrix.module }}/target/pit-reports/
        if-no-files-found: error
        retention-days: 7

  # One stable check name for branch protection, whatever modules the matrix ran.
  mutation-gate:
    if: always() && github.event_name == 'pull_request'
    needs: [ modules, mutation ]
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Check Mutation Results
      env:
        MODULES_RESULT: ${{ needs.modules.result }}
        MUTATION_RESULT: ${{ needs.mutation.result }}
      run: |
        echo "modules: ${MODULES_RESULT}, mutation: ${MUTATION_RESULT}"
        [[ "${MODULES_RESULT}" == "success" ]] \
          && [[ "${MUTATION_RESULT}" == "success" || "${MUTATION_RESULT}" == "skipped" ]]
