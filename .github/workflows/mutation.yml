name: Mutation

on:
  pull_request:
    branches: [ "**" ]
  schedule:
  - cron: '30 3 * * 0'
  workflow_dispatch:

# Declare default permissions as read-only.
permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changed-classes:
    if: github.event_name == 'pull_request'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used in `settings.xml` generated by actions/setup-java
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'

    - name: Run Mutation Tests on Changed Classes
      run: .github/scripts/mutation-pr.sh "origin/${GITHUB_BASE_REF}" -Dpit.threads=4

    - name: List Surviving Mutants
      if: always()
      run: .github/scripts/mutation-survived.sh

    - name: Upload PIT Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pit-reports-pr
        path: '**/target/pit-reports/'
        if-no-files-found: ignore
        retention-days: 7

  full:
    if: github.event_name != 'pull_request'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Used in `settings.xml` generated by actions/setup-java
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [ api, util, clinical-domain-agent, trust-center-agent, research-domain-agent ]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'temurin'
        java-version: 21
        cache: 'maven'
        cache-dependency-path: |
          pom.xml
          {api,util,test-util}/pom.xml
          ${{ matrix.module }}/pom.xml

    - name: Install Upstream Modules
      run: |
        mvn -B -U -T1C -DskipTests -Dcheckstyle.skip -Dcyclonedx.skip \
          -Dspring-boot.repackage.skip=true \
          --also-make --projects ${{ matrix.module }} install

    - name: Run Mutation Tests
      env:
        MAVEN_ARGS: -pl ${{ matrix.module }}
      run: .github/scripts/mutation.sh -Dpit.threads=4

    - name: List Surviving Mutants
      if: always()
      run: .github/scripts/mutation-survived.sh ${{ matrix.module }}

    - name: Upload PIT Reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pit-reports-${{ matrix.module }}
        path: ${{ matrix.module }}/target/pit-reports/
        if-no-files-found: error
        retention-days: 7
