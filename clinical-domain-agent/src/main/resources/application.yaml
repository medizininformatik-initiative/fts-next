spring:
  jackson:
    time-zone: ${TZ:Europe/Berlin}

management:
  endpoints:
    web:
      exposure:
        include: [ "health", "info", "prometheus" ]

  metrics:
    distribution:
      slo:
        http.server.requests: 25,100,250,500,1000,10000
        http.client.requests: 25,100,250,500,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000
        deidentify: 25,100,250,500,1000,10000

security:
  endpoints:
  - path: /api/v2/**
    role: cd-client

runner:
  maxConcurrentPatients: 8
  maxSendConcurrency: 2
  maxConcurrentProcesses: 4
  processTtl: P1D
  # Patients per batched TCA transport-mapping request; larger batches reduce gPAS calls.
  deidentifyBatchSize: 100
  # Max wait for a deidentify batch to fill before dispatching it (ISO-8601 duration).
  deidentifyBatchTimeout: PT2S

springdoc:
  api-docs:
    path: /api/v2/openapi
